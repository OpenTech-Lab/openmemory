# NOTE: postgres/opensearch/redis/falkordb below publish ports on all interfaces
# (e.g. "5432:5432") with no authentication beyond the default dev credentials.
# openmemory-server itself binds to 127.0.0.1 and is token-gated (see README §
# "Privacy & Security"), but these backing stores are not. For personal,
# single-machine use this is the accepted tradeoff; if running on a shared or
# network-exposed host, prefix each port mapping with "127.0.0.1:" to restrict
# them to localhost too.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openmemory
      POSTGRES_PASSWORD: openmemory
      POSTGRES_DB: openmemory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmemory"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9201}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  opensearch-dashboards:
    profiles: [dashboard]
    image: opensearchproject/opensearch-dashboards:2.18.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6399:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6380:6379"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    profiles: [api]
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DRAWIO_EDITOR_URL: ${NEXT_PUBLIC_DRAWIO_EDITOR_URL:-http://localhost:18081}
        NEXT_PUBLIC_DRAWIO_VIEWER_URL: ${NEXT_PUBLIC_DRAWIO_VIEWER_URL:-http://localhost:18081}
        NEXT_PUBLIC_OPEN_PENCIL_URL: ${NEXT_PUBLIC_OPEN_PENCIL_URL:-http://localhost:18082}
    ports:
      - "13000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://openmemory-server:18080
      API_URL: http://openmemory-server:18080
      OPENMEMORY_API_TOKEN: ${OPENMEMORY_API_TOKEN}
      NEXT_PUBLIC_DRAWIO_EDITOR_URL: ${NEXT_PUBLIC_DRAWIO_EDITOR_URL:-http://localhost:18081}
      NEXT_PUBLIC_DRAWIO_VIEWER_URL: ${NEXT_PUBLIC_DRAWIO_VIEWER_URL:-http://localhost:18081}
      NEXT_PUBLIC_OPEN_PENCIL_URL: ${NEXT_PUBLIC_OPEN_PENCIL_URL:-http://localhost:18082}
    depends_on:
      openmemory-server:
        condition: service_healthy
      drawio:
        condition: service_healthy
      open-pencil:
        condition: service_healthy
    restart: unless-stopped

  # Local-only draw.io studio. This serves the user's checked-out static webapp directly, so the
  # browser never needs embed.diagrams.net or viewer.diagrams.net. Override DRAWIO_WEBAPP_PATH if
  # the checkout is not a sibling of this repository, and keep the mount read-only.
  drawio:
    profiles: [api]
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${DRAWIO_PORT:-18081}:80"
    volumes:
      - ${DRAWIO_WEBAPP_PATH:-../drawio/src/main/webapp}:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/index.html || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Local-only OpenPencil embed. Unlike the draw.io service, which mounts a prebuilt
  # static webapp read-only, this must compile the Vite + WASM app, so expect a slow
  # first build. Set OPEN_PENCIL_PATH if the checkout is not a sibling of this repo.
  open-pencil:
    profiles: [api]
    build:
      context: ${OPEN_PENCIL_PATH:-../open-pencil}
      # dockerfile: is resolved relative to `context:` (a sibling checkout, not this repo),
      # so it cannot be a bare relative path here — verified empirically during planning
      # that Compose has no built-in "relative to this compose file" variable for this
      # field specifically (unlike `context:` and `volumes:` host paths, which Compose DOES
      # resolve against the compose file's own directory regardless of invocation cwd).
      # OPENMEMORY_ROOT documents the real constraint (this compose file expects to be
      # invoked from the OpenMemory repo root) instead of silently depending on $PWD.
      dockerfile: ${OPENMEMORY_ROOT:-.}/docker/open-pencil/Dockerfile
      args:
        # Baked into the JS bundle at `vite build` time — this is the embed's
        # postMessage trust anchor, not a runtime-configurable value. Must match the
        # origin the `web` service is actually served from (see NEXT_PUBLIC_OPEN_PENCIL_URL
        # above, and NEXT_PUBLIC_DRAWIO_* for the equivalent web-service-side convention).
        OPENMEMORY_WEB_ORIGIN: ${OPENMEMORY_WEB_ORIGIN:-http://localhost:13000}
    ports:
      - "127.0.0.1:${OPEN_PENCIL_PORT:-18082}:80"
    environment:
      # Injected into the nginx config by the base image's envsubst-on-templates
      # entrypoint (see nginx.conf.template) — never reaches the browser.
      OPENMEMORY_API_TOKEN: ${OPENMEMORY_API_TOKEN}
    volumes:
      # Bare relative path: Compose resolves this against the compose file's own
      # directory regardless of invocation cwd (verified empirically during planning),
      # unlike the dockerfile: path above. Mounted into /etc/nginx/templates/ (not
      # conf.d/) so the base image's own entrypoint script performs the envsubst pass.
      - ./docker/open-pencil/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      # proxy_pass's target contains variables (the path-rewrite captures), which makes
      # nginx defer DNS resolution to request time via the `resolver` directive rather
      # than resolving once at config load — but nginx still needs `openmemory-server` to
      # exist on the network. Verified during planning: a `proxy_pass` to a completely
      # unresolvable static hostname fails nginx startup outright; ordering after
      # openmemory-server's healthcheck avoids that failure mode in normal `docker compose
      # up` bring-up.
      openmemory-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/embed.html || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  openmemory-server:
    profiles: [api]
    build:
      context: .
      dockerfile: Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:${OPENMEMORY_PORT:-18080}:18080"
    # Mounts your home directory so any project path under $HOME can be registered and managed
    # through Source Control. The server is localhost-only (127.0.0.1) and auth-gated.
    volumes:
      # Source Control's Commit & Push action needs to update the registered repository's
      # working tree and .git metadata. The API remains localhost-only and token-gated.
      - ${HOME}:${HOME}:rw
      - design-blobs:/data/design-blobs
      - library-blobs:/data/library-blobs
    environment:
      # Git uses HOME to locate the host user's configured author identity for Source Control commits.
      HOME: ${HOME}
      OPENMEMORY_HOST: "0.0.0.0"
      DATABASE_URL: postgres://openmemory:openmemory@postgres:5432/openmemory
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_URL: redis://redis:6379
      FALKORDB_URL: redis://falkordb:6379
      OPENMEMORY_SECRET_KEY: ${OPENMEMORY_SECRET_KEY:?OPENMEMORY_SECRET_KEY must be set (see .env)}
      OPENMEMORY_API_TOKEN: ${OPENMEMORY_API_TOKEN}
      OPENMEMORY_HOME_DIR: ${HOME}
      OPENMEMORY_DESIGN_BLOB_DIR: /data/design-blobs
      OPENMEMORY_LIBRARY_BLOB_DIR: /data/library-blobs
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Mode 3: Session Watcher — passively records AI agent conversations
  # from tool log directories into PostgreSQL without agent involvement.
  #
  # Supported tools (enabled automatically if the directory exists on the host):
  #   Claude Code  ~/.claude/projects/**/*.jsonl
  #   Gemini CLI   ~/.gemini/**/*.jsonl
  #   Codex CLI    ~/.codex/**/*.jsonl
  #
  # Run with:  docker compose --profile watcher up -d
  # Combined:  docker compose --profile api --profile watcher up -d
  #
  # Tool directories are mounted read-only under /home-sessions so that
  # ~/.xxx paths in the DB expand correctly via HOME=/home-sessions.
  # Tools not installed on the host are silently skipped.
  #
  # On Docker Desktop / macOS / WSL, inotify may miss events through bind
  # mounts. Set WATCHER_POLL_INTERVAL_SEC=30 to enable periodic re-scan.
  # If permission errors occur, add: user: "${UID}:${GID}"
  openmemory-watcher:
    profiles: [watcher]
    build:
      context: .
      dockerfile: Dockerfile.watcher
    user: "1000:1000"
    environment:
      DATABASE_URL: postgres://openmemory:openmemory@postgres:5432/openmemory
      OPENMEMORY_URL: http://openmemory-server:18080
      HOME: /home-sessions
      # WATCHER_POLL_INTERVAL_SEC: "30"
    volumes:
      - ${HOME}/.claude:/home-sessions/.claude:ro
      - ${HOME}/.gemini:/home-sessions/.gemini:ro
      - ${HOME}/.codex:/home-sessions/.codex:ro
      - ${HOME}/.config/github-copilot:/home-sessions/.config/github-copilot:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  opensearch_data:
  redis_data:
  falkordb_data:
  design-blobs:
  library-blobs:
