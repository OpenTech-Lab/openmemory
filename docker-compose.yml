services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openmemory
      POSTGRES_PASSWORD: openmemory
      POSTGRES_DB: openmemory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmemory"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9201}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  opensearch-dashboards:
    profiles: [dashboard]
    image: opensearchproject/opensearch-dashboards:2.18.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6399:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6380:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    profiles: [api]
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://openmemory-server:8080
      OPENMEMORY_API_TOKEN: ${OPENMEMORY_API_TOKEN}
    depends_on:
      openmemory-server:
        condition: service_healthy
    restart: unless-stopped

  openmemory-server:
    profiles: [api]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${OPENMEMORY_PORT:-8080}:8080"
    environment:
      OPENMEMORY_HOST: "0.0.0.0"
      DATABASE_URL: postgres://openmemory:openmemory@postgres:5432/openmemory
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_URL: redis://redis:6379
      FALKORDB_URL: redis://falkordb:6379
      OPENMEMORY_SECRET_KEY: ${OPENMEMORY_SECRET_KEY:-dev-secret-key-change-me}
      OPENMEMORY_API_TOKEN: ${OPENMEMORY_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Mode 3: Session Watcher — passively records AI agent conversations
  # from tool log directories into PostgreSQL without agent involvement.
  #
  # Supported tools (enabled automatically if the directory exists on the host):
  #   Claude Code  ~/.claude/projects/**/*.jsonl
  #   Gemini CLI   ~/.gemini/**/*.jsonl
  #   Codex CLI    ~/.codex/**/*.jsonl
  #
  # Run with:  docker compose --profile watcher up -d
  # Combined:  docker compose --profile api --profile watcher up -d
  #
  # Tool directories are mounted read-only under /home-sessions so that
  # ~/.xxx paths in the DB expand correctly via HOME=/home-sessions.
  # Tools not installed on the host are silently skipped.
  #
  # On Docker Desktop / macOS / WSL, inotify may miss events through bind
  # mounts. Set WATCHER_POLL_INTERVAL_SEC=30 to enable periodic re-scan.
  # If permission errors occur, add: user: "${UID}:${GID}"
  openmemory-watcher:
    profiles: [watcher]
    build:
      context: .
      dockerfile: Dockerfile.watcher
    user: "1000:1000"
    environment:
      DATABASE_URL: postgres://openmemory:openmemory@postgres:5432/openmemory
      OPENMEMORY_URL: http://openmemory-server:8080
      HOME: /home-sessions
      # WATCHER_POLL_INTERVAL_SEC: "30"
    volumes:
      - ${HOME}/.claude:/home-sessions/.claude:ro
      - ${HOME}/.gemini:/home-sessions/.gemini:ro
      - ${HOME}/.codex:/home-sessions/.codex:ro
      - ${HOME}/.config/github-copilot:/home-sessions/.config/github-copilot:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  opensearch_data:
  redis_data:
  falkordb_data:
