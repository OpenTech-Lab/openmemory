server {
    listen 80;
    # This conf is bind-mounted read-only (see docker-compose.yml), so the base image's
    # 10-listen-on-ipv6-by-default.sh entrypoint script cannot inject an IPv6 listener
    # into it as it does for a normal writable /etc/nginx/conf.d/default.conf. Without
    # this line, "localhost" (which resolves to ::1 first in most containers) gets
    # connection-refused even though the IPv4 listener is serving fine — this is exactly
    # what broke the healthcheck's `wget http://localhost/embed.html`.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # The offline guarantee. Configuration flags inside the app stop it from *trying* to
    # reach the network; this stops it from *succeeding* if a future upstream change
    # reintroduces a fetch. 'wasm-unsafe-eval' is required to instantiate CanvasKit.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self'; img-src 'self' data: blob:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; frame-ancestors *" always;

    location / {
        try_files $uri $uri/ =404;
    }

    types {
        application/wasm wasm;
    }
}
